server.port=${PORT:8080}
spring.application.name=task-manager-api

# Banco de dados PostgreSQL (configuração padrão para desenvolvimento)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (obrigatório: use uma chave Base64 forte em produção)
# Fallback apenas para desenvolvimento local — troque em produção via variável de ambiente JWT_SECRET
app.jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRlc3RpbmdQdXJwb3Nlc011Y2hMb25nZXJUaGFuMjU2Qml0cw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Profile ativo (dev, test, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}